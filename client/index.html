<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Auction — One Circle, One Price</title>
    <script>
      try {
        var t = localStorage.getItem("auction-theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("auction-motion") === "off") document.documentElement.classList.add("no-motion");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
